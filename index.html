<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeFlow — نظام إدارة الحياة الشخصية</title>
  <meta name="description" content="نظام متكامل لإدارة الحياة والإنتاجية، محلي بالكامل وآمن، يدعم المزامنة السحابية مع Google Drive والتنبيهات الصوتية في الخلفية.">
  <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b100f" media="(prefers-color-scheme: dark)">

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeFlow">

  <!-- Configuration (GIS loaded on demand) -->
  <script src="/google-config.js"></script>

  <!-- Instant Theme Boot Script (Prevents flash of white/dark) -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('lf.prefs') || '{}');
        var t = p.theme || 'system';
        var isDark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- Fallback while scripts mount -->
    <noscript>
      <div style="padding:40px;text-align:center;font-family:system-ui;">
        <h2>يرجى تفعيل الجافاسكربت لتشغيل تطبيق LifeFlow.</h2>
      </div>
    </noscript>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
